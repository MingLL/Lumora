# 可选：集群内的 MySQL。
#
# 如果 dev1/dev2 上已经有一套 MySQL，别用这个文件 —— 直接把 .env 里的
# MYSQL_HOST 指过去就行，后端不关心数据库跑在哪。
#
# 用了这个文件的话：
#   - 数据落在 dev1 的 /opt/lumora/mysql，用 nodeSelector 钉死在 dev1，
#     因为 hostPath 不跟着 pod 漂移，换节点就等于换了一个空库。
#   - 备份和加密是你的责任，见 backend/README.md 的「Operating the Database」。
#     hostPath 本身不提供任何加密。
---
apiVersion: v1
kind: Service
metadata:
  name: lumora-mysql
  namespace: lumora
spec:
  selector:
    app: lumora-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lumora-mysql
  namespace: lumora
spec:
  serviceName: lumora-mysql
  replicas: 1
  selector:
    matchLabels:
      app: lumora-mysql
  template:
    metadata:
      labels:
        app: lumora-mysql
    spec:
      nodeSelector:
        kubernetes.io/hostname: __MYSQL_NODE__
      containers:
        - name: mysql
          # 和前端 nginx 同样的理由走 ECR Public：阿里云机器直连 Docker Hub 不通。
          image: public.ecr.aws/docker/library/mysql:8.4
          imagePullPolicy: IfNotPresent
          args:
            # 应用侧统一用 UTC 存取，库也钉在 UTC，避免跨时区偏移。
            - "--default-time-zone=+00:00"
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: lumora-env
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: lumora-env
                  key: MYSQL_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumora-env
                  key: MYSQL_PASSWORD
            - name: MYSQL_RANDOM_ROOT_PASSWORD
              value: "yes"
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          hostPath:
            path: /opt/lumora/mysql
            type: DirectoryOrCreate
