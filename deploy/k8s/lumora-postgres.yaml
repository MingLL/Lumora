# 集群内的 PostgreSQL，取代原来的 MySQL 8.4。
#
#   - 数据落在 __PG_NODE__ 的 /opt/lumora/postgres，用 nodeSelector 钉死在那台，
#     因为 hostPath 不跟着 pod 漂移，换节点就等于换了一个空库。
#   - 线上当前钉在 dev2。备份要认准这台。
#   - 备份和加密是你的责任，见 backend/README.md 的「Operating the Database」。
#     hostPath 本身不提供任何加密。
#
# 为什么从 MySQL 换过来：MySQL 8.4 为 0.3 MB 的数据常驻 484 MiB（performance_schema
# 等独占服务器默认值），在 1870 MiB 的 dev2 上和三个 JVM 一起把节点推到 OOM。
---
apiVersion: v1
kind: Service
metadata:
  name: lumora-postgres
  namespace: lumora
spec:
  clusterIP: None
  selector:
    app: lumora-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lumora-postgres
  namespace: lumora
  labels:
    app: lumora-postgres
spec:
  serviceName: lumora-postgres
  replicas: 1
  selector:
    matchLabels:
      app: lumora-postgres
  template:
    metadata:
      labels:
        app: lumora-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: __PG_NODE__
      containers:
        - name: postgres
          # 和前端 nginx 同样的理由走 ECR Public：阿里云机器直连 Docker Hub 不通。
          image: public.ecr.aws/docker/library/postgres:17-alpine
          imagePullPolicy: IfNotPresent
          args:
            # 人工排查时的显示基准。V5 之前这里必须是 UTC —— 那时时间列是无时区的
            # timestamp，服务器时区会决定 CURRENT_TIMESTAMP 默认值折算成哪个墙钟，
            # 一改就和应用经 pgjdbc 写入的列错开 8 小时。V5 把时间列全换成
            # TIMESTAMPTZ 之后，值自带偏移量，会话时区只影响渲染，不再影响存的是
            # 哪一刻，所以这里可以按人看着方便来设。
            #
            # 确认过 mapper 与迁移里没有 date_trunc / EXTRACT / ::date / to_char
            # 这类依赖会话时区的表达式，改这个碰不到任何查询语义。
            # 应用侧不受影响：Hikari 的 connection-init-sql 每条连接都会把自己的
            # 会话钉回 UTC（WechatEventRepositoryTest 断言了这一点）。
            #
            # 注意这行只在 PostgreSQL 重启后才生效。线上是用
            # `ALTER DATABASE lumora SET TimeZone = 'Asia/Shanghai'` 免重启落地的，
            # 库级设置本来就覆盖服务器级，两者同值，重建集群时行为一致。
            - "-c"
            - "timezone=Asia/Shanghai"
            # 0.3 MB 的库，默认值是给独占服务器调的，全部收小。
            - "-c"
            - "shared_buffers=32MB"
            - "-c"
            - "max_connections=32"
            - "-c"
            - "work_mem=2MB"
            - "-c"
            - "maintenance_work_mem=16MB"
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: lumora-env
                  key: POSTGRES_DATABASE
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lumora-env
                  key: POSTGRES_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumora-env
                  key: POSTGRES_PASSWORD
            # 官方镜像默认把数据放在 /var/lib/postgresql/data 的根，挂 hostPath 时
            # lost+found 之类的残留会让 initdb 拒绝启动，所以下沉一层子目录。
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-q"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-q"]
            # 60 而不是 30：首次启动要在 hostPath 上跑 initdb，而这台机器内存紧张。
            # liveness 只在服务器卡死时才有价值，启动阶段多给的宽限期是白送的；
            # 探针早杀一次就会变成 initdb 半途被打断、反复重启。就绪由上面的
            # readinessProbe 判断，它 10 秒就开始探，不受这个值影响。
            initialDelaySeconds: 60
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          hostPath:
            path: /opt/lumora/postgres
            type: DirectoryOrCreate
