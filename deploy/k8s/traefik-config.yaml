# Traefik HelmChartConfig：覆盖 k3s 自带的 Traefik 配置。
#
# 这个文件同时存在于两处，改一处必须改另一处：
#   - git:       deploy/k8s/traefik-config.yaml        （版本追溯）
#   - dev1:      /var/lib/rancher/k3s/server/manifests/traefik-config.yaml  （k3s auto-apply）
#
# k3s 每次重启会用 manifest 目录里的文件重新 apply。如果只 kubectl apply 而不
# 更新 manifest 文件，k3s 重启后配置会被 manifest 里的旧版覆盖 -- 这正是
# 2026-08-06 的证书故障根因：manifest 是精简版（缺 certificatesResolvers），
# k3s 重启后 ACME 配置丢失，Traefik 回退到自签默认证书，浏览器报
# "您的连接不是私密连接"。
#
# 改这个文件后：commit + push，再 scp 到 dev1 的 manifest 目录，k3s 会在
# 30 秒内自动 apply；也可以直接 kubectl apply 立即生效。
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    image:
      repository: public.ecr.aws/docker/library/traefik
      tag: v3.3.2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 192Mi
    # Persistent access logs (JSON) on dev1 hostPath /var/log/traefik.
    # Rotated daily by host logrotate /etc/logrotate.d/traefik (copytruncate, 30d).
    logs:
      general:
        level: INFO
      access:
        enabled: true
        format: json
        filePath: /var/log/traefik/access.log
        fields:
          headers:
            defaultmode: drop
            names:
              User-Agent: keep
              Referer: keep
    deployment:
      additionalVolumes:
        - name: traefik-logs
          hostPath:
            path: /var/log/traefik
            type: DirectoryOrCreate
    additionalVolumeMounts:
      - name: traefik-logs
        mountPath: /var/log/traefik
    ports:
      web:
        # 80 端口整体 301 到 443。在这之前只有 HSTS 在兜：浏览器访问过一次 https
        # 才会自己升级，首次访问、以及 curl / 爬虫 / RSS 阅读器这类不认 HSTS 的
        # 客户端一直走明文。lumora-ingress.yaml 的注释早就假设了这条跳转存在。
        #
        # ACME 不受影响：Traefik 的 http-01 挑战路由优先级高于入口层跳转，
        # /.well-known/acme-challenge/ 仍然在 80 端口明文应答（下面 le-prod 用的就是它）。
        #
        # ⚠️ 语法按 chart v34 写。旧的 `redirectTo: {port: websecure}`（deploy/README.md
        # 「接 HTTPS」一节记的就是这个）在 v34 已被移除，用它 helm upgrade 会直接 fail。
        # permanent: true 才是 301，不写默认发 302。
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
        forwardedHeaders:
          insecure: false
          trustedIPs: []
    service:
      spec:
        externalTrafficPolicy: Local
    nodeSelector:
      kubernetes.io/hostname: dev1
    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 128Mi
      storageClass: local-path
      path: /data
      annotations:
        lumora.love/managed: "true"
    certificatesResolvers:
      le-prod:
        acme:
          email: ambition1314@icloud.com
          storage: /data/acme-prod.json
          caServer: https://acme-v02.api.letsencrypt.org/directory
          httpChallenge:
            entryPoint: web
