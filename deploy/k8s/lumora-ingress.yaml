# 远方有温度 —— 对外入口层（HTTPS 路由 + 安全响应头）
#
# 前后端共用这一层，所以单独成文件：放进 lumora.yaml 会让前端发布顺带接管
# 后端的路由，放进 lumora-backend.yaml 则反过来。两个发布脚本都会 apply 它。
#
# 分工：
#   - 本文件的 IngressRoute 承载 websecure(443) 的全部路由，并签发/续签证书；
#   - lumora.yaml 里的 Ingress 只覆盖 web(80)，且 Traefik 在入口层把 80 整体
#     301 到 443（见 deploy/README.md「接域名」）。
#
# ⚠️ 这里的对象曾长期只存在于线上、不在仓库里，导致 deploy.sh 用旧清单把线上
#    改动覆盖掉过。改动请务必写回本文件。
#    www-to-apex 就是又一例：2026-08-04 在集群里手建，仓库里一直没有，
#    对应的 www 路由后来被一次清理连带删掉，中间件成了孤儿 ——
#    于是 www.lumora.love 有 DNS、有证书，访问却 404。2026-08-09 补回。
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lumora-security-headers
  namespace: lumora
spec:
  headers:
    # HSTS 半年。forceSTSHeader 关着，所以只在 HTTPS 响应上带这个头，
    # 不会在明文响应里误发。
    stsSeconds: 15552000
    stsIncludeSubdomains: true
    stsPreload: false
    forceSTSHeader: false
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      # 隐藏 Server 头（server_tokens off 只去版本号，这里彻底去掉）
      Server: ""
      # CSP 先用 Report-Only 观察，确认没有误伤再换成 Content-Security-Policy。
      # 站点有一个内联 <script type="module">，所以暂时留着 'unsafe-inline'。
      # upgrade-insecure-requests 是强制执行性指令，在 Report-Only 模式下被
      # 浏览器忽略并报这个警告；站点已是全 HTTPS（HSTS + 80->301），不需要它。
      # 等 CSP 从 Report-Only 切成真正的 Content-Security-Policy 时再加回来。
      # script-src 放行 res.wx.qq.com：文章页加载微信 JS-SDK jweixin-1.6.0.js。
      Content-Security-Policy: >-
        default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none';
        form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';
        script-src 'self' 'unsafe-inline' https://res.wx.qq.com; connect-src 'self'
      Permissions-Policy: >-
        camera=(), microphone=(), geolocation=(), payment=(), usb=(),
        interest-cohort=()
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lumora-client-event-buffer
  namespace: lumora
spec:
  # /client-events 是匿名开放接口，properties 字段可以是任意 JSON。没有这一层
  # 的话请求体在链路上任何一环都不受限：Traefik 默认不限，nginx 不经手这条路径，
  # Spring 的 max-http-form-post-size 只管表单不管 JSON body ——
  # 于是超大 body 会先被 Jackson 展开成 Java Map 再落库。这里按 4 KB 截断，
  # 超过直接 413，请求根本到不了后端。
  # memRequestBodyBytes 设成同一个值，避免 Traefik 把请求体落到磁盘暂存。
  #
  # ⚠️ 只挂在 /client-events 上，不要挂到 /wechat/callback ——
  # 微信回调的报文大小不由我们控制。
  buffering:
    maxRequestBodyBytes: 4096
    memRequestBodyBytes: 4096
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
  namespace: lumora
spec:
  # www 统一 301 到主域名，避免同一份内容出现在两个地址上（canonical 也只写主域名）。
  redirectRegex:
    permanent: true
    regex: ^https://www\.lumora\.love/(.*)
    replacement: https://lumora.love/${1}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lumora-love-tls
  namespace: lumora
spec:
  entryPoints:
    - websecure
  routes:
    # 埋点单独一条路由，只为了能挂 buffering 限制请求体大小 ——
    # 和回调合成一条的话，4 KB 上限会连微信回调一起限住。
    - kind: Rule
      match: Host(`lumora.love`) && Path(`/client-events`)
      priority: 300
      middlewares:
        - name: lumora-security-headers
          namespace: lumora
        - name: lumora-client-event-buffer
          namespace: lumora
      services:
        - name: lumora-backend-web
          port: 8080
    # 回调路径更长，用更高的 priority 保证先于兜底规则命中。
    - kind: Rule
      match: Host(`lumora.love`) && PathPrefix(`/wechat/callback`)
      priority: 200
      middlewares:
        - name: lumora-security-headers
          namespace: lumora
      services:
        - name: lumora-backend-web
          port: 8080
    - kind: Rule
      match: Host(`lumora.love`)
      priority: 100
      middlewares:
        - name: lumora-security-headers
          namespace: lumora
      services:
        - name: lumora-web
          port: 80
    # www 只负责跳到主域名。中间件顺序有意为之：安全头在前，跳转在后 ——
    # 跳转会直接短路返回 301，响应回程仍会经过安全头中间件，这样 301 上也带 HSTS。
    # 后端服务只是占位，请求走不到那里。
    - kind: Rule
      match: Host(`www.lumora.love`)
      priority: 50
      middlewares:
        - name: lumora-security-headers
          namespace: lumora
        - name: www-to-apex
          namespace: lumora
      services:
        - name: lumora-web
          port: 80
  tls:
    # Let's Encrypt，ACME http-01 走 80 端口 —— 入口层的 301 不会拦截挑战路径，
    # Traefik 的 ACME 路由优先级高于跳转。
    certResolver: le-prod
