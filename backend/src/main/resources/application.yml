spring:
  application:
    name: lumora
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 取代 MySQL URL 上的 connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true。
      # 应用统一按 UTC 存取，会话时区必须钉死，否则容器时区一变读出来的时间就偏。
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: false
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_AUTH_CODE}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

management:
  endpoint:
    health:
      probes:
        enabled: true

lumora:
  wechat-app-id: ${WECHAT_APP_ID:}
  wechat-original-id: ${WECHAT_ORIGINAL_ID:}
  wechat-token: ${WECHAT_TOKEN:}
  wechat-aes-key: ${WECHAT_AES_KEY:}
  wechat-app-secret: ${WECHAT_APP_SECRET:}
  postgres-host: ${POSTGRES_HOST:}
  postgres-port: ${POSTGRES_PORT:5432}
  postgres-database: ${POSTGRES_DATABASE:}
  postgres-username: ${POSTGRES_USERNAME:}
  postgres-password: ${POSTGRES_PASSWORD:}
  mail-username: ${MAIL_USERNAME:}
  mail-auth-code: ${MAIL_AUTH_CODE:}
  mail-from-name: ${MAIL_FROM_NAME:Lumora}
  report-recipients: ${REPORT_RECIPIENTS:}
  site-origin: ${SITE_ORIGIN:https://lumora.love}
  report-admin-key: ${REPORT_ADMIN_KEY:}
  zone: ${LUMORA_ZONE:Asia/Shanghai}
  scheduling-enabled: ${SCHEDULING_ENABLED:true}
  report-recovery-enabled: ${REPORT_RECOVERY_ENABLED:true}
  retention-enabled: ${RETENTION_ENABLED:true}
  internal-send-enabled: ${INTERNAL_SEND_ENABLED:true}
  worker-ready-marker: ${WORKER_READY_MARKER:/tmp/lumora-worker-ready}
